name: Release

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

# Serialize all release attempts; never interrupt an upload or replace a tag.
concurrency:
  group: workspool-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked test environment
        run: |
          python -m pip install uv==0.13.7
          uv sync --locked --extra benchmark --extra tokens --python 3.12
      - name: Lint and test
        run: |
          uv run --no-sync ruff check src tests benchmarks
          uv run --no-sync ruff format --check src tests
          uv run --locked --extra benchmark --extra tokens pytest -q
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Verify package metadata, licenses, checksums, and release notes
        id: package
        run: |
          python - <<'PY'
          import email
          import hashlib
          import os
          import re
          import tarfile
          import tomllib
          import zipfile
          from pathlib import Path

          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          version = project['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Use a stable release version'
          assert project['name'] == 'agent-workbook'
          assert project['license'] == 'LicenseRef-MIT-Commons-Clause'
          license_paths = ['LICENSE', 'src/agent_workbook/_tokenizers/LICENSE.tiktoken']
          assert project['license-files'] == license_paths, 'License file declarations changed'
          license_bytes = {name: Path(name).read_bytes() for name in license_paths}
          assert b'Commons Clause' in license_bytes['LICENSE'] and b'MIT License' in license_bytes['LICENSE']
          assert b'Copyright (c) 2022 OpenAI, Shantanu Jain' in license_bytes[license_paths[1]]
          wheels = list(Path('dist').glob('*.whl'))
          sdists = list(Path('dist').glob('*.tar.gz'))
          assert len(wheels) == len(sdists) == 1, 'Expected exactly one wheel and sdist'

          def verify(metadata_bytes, packaged_licenses):
              metadata = email.message_from_bytes(metadata_bytes)
              assert metadata['Name'] == project['name'], 'Package name mismatch'
              assert metadata['Version'] == version, 'Package version mismatch'
              assert metadata['License-Expression'] == project['license'], 'License expression mismatch'
              assert metadata.get_all('License-File') == license_paths, 'Missing license declaration'
              assert packaged_licenses == license_bytes, 'Packaged license differs from repository'

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_paths = [name for name in archive.namelist() if name.endswith('.dist-info/METADATA')]
              assert len(metadata_paths) == 1
              metadata_path = metadata_paths[0]
              license_root = metadata_path.rsplit('/', 1)[0] + '/licenses/'
              verify(archive.read(metadata_path), {name: archive.read(license_root + name) for name in license_paths})
              assert archive.read('agent_workbook/_tokenizers/LICENSE.tiktoken') == license_bytes[license_paths[1]], 'Package resource notice differs'
          with tarfile.open(sdists[0], 'r:gz') as archive:
              metadata_paths = [name for name in archive.getnames() if name.count('/') == 1 and name.endswith('/PKG-INFO')]
              assert len(metadata_paths) == 1
              prefix = metadata_paths[0].split('/')[0]
              verify(archive.extractfile(metadata_paths[0]).read(), {name: archive.extractfile(prefix + '/' + name).read() for name in license_paths})

          sums = ''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in sorted(wheels + sdists))
          Path('dist/SHA256SUMS').write_text(sums)
          entry = re.search(r'^## ' + re.escape(version) + r'(?:[ \t]+[^\n]*)?\n(.*?)(?=^## |\Z)', Path('CHANGELOG.md').read_text(), re.M | re.S)
          assert entry and entry[1].strip(), 'Add this version to CHANGELOG.md before releasing'
          source = f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/blob/{os.environ["GITHUB_SHA"]}'
          Path('dist/release-notes.md').write_text(
              f'Licensing: [MIT with Commons Clause]({source}/LICENSE).\n\n' + entry[1].strip() + '\n'
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          print(f'Verified wheel and sdist for v{version}, including both complete license notices.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require the complete CI matrix for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          sha = os.environ['GITHUB_SHA']
          root = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          deadline = time.monotonic() + 900
          while time.monotonic() < deadline:
              request = urllib.request.Request(root + '/actions/runs?head_sha=' + sha + '&per_page=100', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.load(response)['workflow_runs']
              matches = [run for run in runs if run['path'] == '.github/workflows/ci.yml' and run['event'] == 'push' and run['head_branch'] == 'main' and run['head_sha'] == sha]
              if matches:
                  run = max(matches, key=lambda value: value['id'])
                  if run['status'] == 'completed':
                      if run['conclusion'] != 'success':
                          raise SystemExit('Refusing publication: CI concluded ' + str(run['conclusion']) + ' for ' + sha)
                      print('Complete CI matrix passed for ' + sha)
                      break
              time.sleep(15)
          else:
              raise SystemExit('Timed out waiting for the exact commit to pass CI; no release was published')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist
      - name: Verify transferred assets
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Create a new tag at the tested commit and publish verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          version = os.environ['VERSION']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          tag = 'v' + version
          root = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}

          def api(path, data=None, missing_ok=False):
              request = urllib.request.Request(root + path, data=None if data is None else json.dumps(data).encode(), headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise SystemExit(f'GitHub API failed for {path}: HTTP {error.code}')

          for path in ('/git/ref/tags/' + tag, '/releases/tags/' + tag):
              if api(path, missing_ok=True) is not None:
                  raise SystemExit(f'{tag} already exists; refusing to replace its tag or release. Inspect any draft left by an earlier failed attempt.')
          # Creating a reference is atomic: a racing creator fails instead of
          # updating an existing tag. No force/update/delete endpoint is used.
          created = api('/git/refs', {'ref': 'refs/tags/' + tag, 'sha': os.environ['GITHUB_SHA']})
          assert created['object']['sha'] == os.environ['GITHUB_SHA']
          PY
          gh release create "v$VERSION" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --target "$GITHUB_SHA" --title "Workspool v$VERSION" \
            --notes-file dist/release-notes.md --draft
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" --jq .object.sha)" = "$GITHUB_SHA"
          gh release edit "v$VERSION" --draft=false
