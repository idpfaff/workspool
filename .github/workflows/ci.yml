name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --locked --extra benchmark --extra tokens --python ${{ matrix.python }}
      - name: Lint
        run: |
          uv run --no-sync ruff check src tests benchmarks
          uv run --no-sync ruff format --check src tests
      - name: Test
        run: uv run --locked --extra benchmark --extra tokens pytest -q

  minimum-mcp:
    name: ubuntu-latest / Python 3.12 / mcp 1.26
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies with the minimum supported MCP SDK
        run: |
          uv sync --locked --extra benchmark --extra tokens --python 3.12
          uv pip install "mcp==1.26.0"
      - name: Test
        run: uv run --no-sync --extra benchmark --extra tokens pytest -q
